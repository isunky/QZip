[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/cli",
  "crates/archive-core",
  "crates/archive-sevenzip",
  "crates/archive-security",
  "crates/task-runtime",
  "crates/platform-integration"
]

[workspace.package]
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["QZip Contributors"]
repository = "https://github.com/isunky/QZip"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
secrecy = "0.10.3"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "signal", "io-util", "sync", "time", "fs"] }
tokio-util = "0.7.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
fs2 = "0.4.3"
sha2 = "0.10.9"
