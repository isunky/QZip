name: Build and release NSIS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or build label, for example rc2, preview-20260731, or v1.0.0-rc.2
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease when mode is publish
        required: true
        default: true
        type: boolean
      mode:
        description: build-only uploads an artifact; publish creates a GitHub Release, using unsigned feature degradation when trusted signing is unavailable
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - publish

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-nsis:
    name: build-nsis-${{ inputs.mode }}
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      release_label: ${{ steps.metadata.outputs.release_label }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      signing_mode: ${{ steps.build.outputs.signing_mode }}
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      QZIP_WINDOWS_PUBLISHER: ${{ vars.QZIP_WINDOWS_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: metadata
        name: Prepare release metadata
        shell: pwsh
        env:
          RELEASE_LABEL_INPUT: ${{ inputs.tag }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          $tag = $env:RELEASE_LABEL_INPUT.Trim()
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -match '[\r\n]' -or $tag.IndexOfAny([IO.Path]::GetInvalidFileNameChars()) -ge 0) {
            throw 'Release tag or build label must be non-empty and safe for a Windows filename.'
          }
          "release_label=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "tag=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "prerelease=$env:PRERELEASE_INPUT" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify official 7-Zip sidecar
        run: pnpm sidecar:fetch
      - name: Check workspace
        run: pnpm check
      - name: Run core compression regression
        run: pnpm test:core:windows
      - id: signing
        name: Prepare trusted signing credentials when available
        continue-on-error: true
        shell: pwsh
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          "enabled=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          if ($env:RELEASE_MODE -ne 'publish') {
            exit 0
          }
          $required = @('WINDOWS_PFX_BASE64', 'WINDOWS_PFX_PASSWORD', 'QZIP_WINDOWS_PUBLISHER')
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            $message = "Trusted Windows signing is unavailable because these values are not configured: $($missing -join ', '). Building a clean unsigned-degraded artifact; publish mode will still create a GitHub Release with a warning."
            Write-Warning $message
            "### Trusted signing skipped`n`n$message" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit 0
          }
          try {
            $pfx = Join-Path $env:RUNNER_TEMP 'qzip-signing.pfx'
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $securePassword = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
            $certificate = Get-PfxCertificate -FilePath $pfx -Password $securePassword
            if (-not $certificate -or $certificate.Subject -notlike "*$env:QZIP_WINDOWS_PUBLISHER*") {
              throw 'The PFX certificate does not match QZIP_WINDOWS_PUBLISHER.'
            }
            "QZIP_WINDOWS_PFX_PATH=$pfx" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            "enabled=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          }
          catch {
            $message = "Trusted Windows signing credentials could not be prepared: $($_.Exception.Message). The workflow will build an unsigned-degraded release."
            Write-Warning $message
            "### Trusted signing unavailable`n`n$message" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
      - id: signed_build
        name: Attempt trusted NSIS build
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-nsis.ps1 -Release
      - id: build
        name: Finalize trusted or unsigned-degraded NSIS build
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNED_BUILD_OUTCOME: ${{ steps.signed_build.outcome }}
        run: |
          if ($env:SIGNING_ENABLED -eq 'true' -and $env:SIGNED_BUILD_OUTCOME -eq 'success') {
            "signing_mode=trusted" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            exit 0
          }
          if ($env:SIGNING_ENABLED -eq 'true') {
            $message = 'The trusted signing build failed. Rebuilding a clean unsigned-degraded installer instead.'
            Write-Warning $message
            "### Trusted build fallback`n`n$message" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          $staleSignedOutputs = @(
            (Join-Path $env:GITHUB_WORKSPACE 'target\release\bundle'),
            (Join-Path $env:GITHUB_WORKSPACE 'target\release\qzip-desktop.exe')
          )
          foreach ($output in $staleSignedOutputs) {
            if (-not (Test-Path -LiteralPath $output)) { continue }
            $resolved = [IO.Path]::GetFullPath($output)
            $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
            if (-not $resolved.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw "Unsafe signed-output cleanup path: $resolved" }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
          powershell -ExecutionPolicy Bypass -File scripts/build-nsis.ps1 -UnsignedRelease
          "signing_mode=unsigned-degraded" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Assemble and verify NSIS release assets
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ steps.metadata.outputs.release_label }}
          SIGNING_MODE: ${{ steps.build.outputs.signing_mode }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/prepare-rc-release.ps1 -Version $env:RELEASE_LABEL -SkipBundle -SigningMode $env:SIGNING_MODE -Publisher $env:QZIP_WINDOWS_PUBLISHER
          if ($env:SIGNING_MODE -eq 'trusted') {
            powershell -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_LABEL -ExpectedSigningMode trusted -RequireTrustedSignature -ExpectedPublisher $env:QZIP_WINDOWS_PUBLISHER
          } else {
            powershell -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_LABEL -ExpectedSigningMode unsigned-degraded
          }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/${{ steps.metadata.outputs.release_label }}/**
      - uses: actions/upload-artifact@v4
        with:
          name: qzip-nsis
          path: artifacts/release/${{ steps.metadata.outputs.release_label }}/**
          if-no-files-found: error

  publish:
    name: publish-github-release
    if: inputs.mode == 'publish'
    needs: build-nsis
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qzip-nsis
          path: artifacts/release/${{ needs.build-nsis.outputs.release_label }}
      - name: Fetch release payload verifier
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-sevenzip.ps1
      - name: Verify release assets
        shell: pwsh
        env:
          QZIP_WINDOWS_PUBLISHER: ${{ vars.QZIP_WINDOWS_PUBLISHER }}
          RELEASE_LABEL: ${{ needs.build-nsis.outputs.release_label }}
          SIGNING_MODE: ${{ needs.build-nsis.outputs.signing_mode }}
        run: |
          if ($env:SIGNING_MODE -eq 'trusted') {
            powershell -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_LABEL -ExpectedSigningMode trusted -RequireTrustedSignature -ExpectedPublisher $env:QZIP_WINDOWS_PUBLISHER
          } else {
            powershell -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_LABEL -ExpectedSigningMode unsigned-degraded
          }
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-nsis.outputs.tag }}
          RELEASE_LABEL: ${{ needs.build-nsis.outputs.release_label }}
          PRERELEASE: ${{ needs.build-nsis.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
          SIGNING_MODE: ${{ needs.build-nsis.outputs.signing_mode }}
        run: |
          $arguments = @('release', 'create', $env:TAG, "artifacts/release/$env:RELEASE_LABEL/*", '--target', $env:TARGET_SHA, '--generate-notes', '--title', "QZip $env:TAG")
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          if ($env:SIGNING_MODE -eq 'unsigned-degraded') {
            $warning = @'
          > [!WARNING]
          > 此版本未使用受信任的 Authenticode 证书签名，Windows 可能显示“未知发布者”或 SmartScreen 提示。
          > Windows 11 一级现代右键菜单已禁用；应用界面、“打开方式/QZip”和文件关联仍可正常使用。
          > 请使用随 Release 提供的 `checksums-sha256.txt` 验证安装包。

          This build is unsigned and feature-degraded. Windows may show an Unknown Publisher or SmartScreen warning. The Windows 11 modern context menu is unavailable; core archive features and file associations remain available.
          '@
            $arguments += @('--notes', $warning)
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
