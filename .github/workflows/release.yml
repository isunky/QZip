name: Build and release QZip

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  repository_dispatch:
    types:
      - qzip-release-build

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.client_payload.branch }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: prepare-${{ inputs.version_increment }}-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Require the default branch
        shell: pwsh
        env:
          SELECTED_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -ne 'branch' -or $env:SELECTED_BRANCH -ne $env:DEFAULT_BRANCH) {
            throw "Stable releases must be started from the default branch '$env:DEFAULT_BRANCH'."
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Fetch stable release tags
        run: git fetch --force --tags origin
      - id: version
        name: Calculate and synchronize version
        shell: pwsh
        env:
          VERSION_INCREMENT: ${{ inputs.version_increment }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/bump-version.ps1 -Increment $env:VERSION_INCREMENT
      - id: commit
        name: Create the release commit
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $allowed = @(
            'Cargo.toml',
            'Cargo.lock',
            'package.json',
            'apps/desktop/package.json',
            'apps/desktop/src-tauri/tauri.conf.json',
            'packages/ui/package.json'
          )
          $changed = @(& git status --porcelain=v1 | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) {
            throw "Version preparation changed unexpected files: $($unexpected -join ', ')"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git diff --cached --quiet
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -gt 1) { throw 'Unable to inspect the staged version changes.' }
          if ($diffExitCode -eq 1) {
            & git commit -m "chore(release): $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the release commit.' }
          }
          if (@(& git status --porcelain=v1).Count -ne 0) { throw 'Release commit did not leave a clean working tree.' }
          $releaseSha = (& git rev-parse HEAD).Trim()
          "release_sha=$releaseSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
      - name: Push the release commit
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          & git push origin "HEAD:refs/heads/$env:BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push the release commit. The branch may have advanced or be protected.' }
      - name: Start the verified build and publish run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $body = [ordered]@{
            event_type = 'qzip-release-build'
            client_payload = [ordered]@{
              version = $env:RELEASE_VERSION
              tag = $env:RELEASE_TAG
              release_sha = $env:RELEASE_SHA
              branch = $env:BRANCH
            }
          } | ConvertTo-Json -Depth 4 -Compress
          $body | gh api --method POST "repos/$env:GITHUB_REPOSITORY/dispatches" --input -
          if ($LASTEXITCODE -ne 0) { throw 'Unable to start the release build.' }
          "### Release prepared`n`n$env:RELEASE_TAG was committed at $env:RELEASE_SHA. The build and publish run has been queued." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

  build-nsis:
    name: build-${{ github.event.client_payload.tag }}
    if: github.event_name == 'repository_dispatch' && github.event.action == 'qzip-release-build'
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      signing_mode: ${{ steps.build.outputs.signing_mode }}
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      QZIP_WINDOWS_PUBLISHER: ${{ vars.QZIP_WINDOWS_PUBLISHER }}
      RELEASE_VERSION: ${{ github.event.client_payload.version }}
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
      RELEASE_SHA: ${{ github.event.client_payload.release_sha }}
      RELEASE_BRANCH: ${{ github.event.client_payload.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.release_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate release source and version
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$env:RELEASE_VERSION") {
            throw 'Release dispatch contains invalid stable SemVer metadata.'
          }
          if ($env:RELEASE_BRANCH -ne $env:DEFAULT_BRANCH) { throw 'Release dispatch must target the default branch.' }
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_SHA -or $env:GITHUB_SHA -ne $env:RELEASE_SHA) {
            throw 'Release checkout, dispatch source, and provenance source do not reference the same commit.'
          }
          & git fetch origin "refs/heads/$env:RELEASE_BRANCH`:refs/remotes/origin/$env:RELEASE_BRANCH" --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the release branch.' }
          $remoteHead = (& git rev-parse "refs/remotes/origin/$env:RELEASE_BRANCH").Trim()
          if ($remoteHead -ne $env:RELEASE_SHA) { throw 'The release commit is no longer the head of the default branch.' }
          if (@(& git tag --list $env:RELEASE_TAG).Count -ne 0) { throw "Release tag already exists: $env:RELEASE_TAG" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/bump-version.ps1 -ExpectedVersion $env:RELEASE_VERSION -CheckOnly
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify official 7-Zip sidecar
        run: pnpm sidecar:fetch
      - name: Check workspace
        run: pnpm check
      - name: Run core compression regression
        run: pnpm test:core:windows
      - id: signing
        name: Prepare trusted signing credentials when available
        continue-on-error: true
        shell: pwsh
        run: |
          "enabled=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          $required = @('WINDOWS_PFX_BASE64', 'WINDOWS_PFX_PASSWORD', 'QZIP_WINDOWS_PUBLISHER')
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            $message = "Trusted Windows signing is unavailable because these values are not configured: $($missing -join ', '). Building a clean unsigned-degraded release."
            Write-Warning $message
            "### Trusted signing skipped`n`n$message" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
            exit 0
          }
          try {
            $pfx = Join-Path $env:RUNNER_TEMP 'qzip-signing.pfx'
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $securePassword = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
            $certificate = Get-PfxCertificate -FilePath $pfx -Password $securePassword
            if (-not $certificate -or $certificate.Subject -notlike "*$env:QZIP_WINDOWS_PUBLISHER*") {
              throw 'The PFX certificate does not match QZIP_WINDOWS_PUBLISHER.'
            }
            "QZIP_WINDOWS_PFX_PATH=$pfx" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
            "enabled=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          }
          catch {
            $message = "Trusted Windows signing credentials could not be prepared: $($_.Exception.Message). Building an unsigned-degraded release."
            Write-Warning $message
            "### Trusted signing unavailable`n`n$message" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }
      - id: signed_build
        name: Attempt trusted NSIS build
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-nsis.ps1 -Release
      - id: build
        name: Finalize trusted or unsigned-degraded NSIS build
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNED_BUILD_OUTCOME: ${{ steps.signed_build.outcome }}
        run: |
          if ($env:SIGNING_ENABLED -eq 'true' -and $env:SIGNED_BUILD_OUTCOME -eq 'success') {
            "signing_mode=trusted" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
            exit 0
          }
          if ($env:SIGNING_ENABLED -eq 'true') {
            $message = 'The trusted signing build failed. Rebuilding a clean unsigned-degraded installer instead.'
            Write-Warning $message
            "### Trusted build fallback`n`n$message" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }
          $staleSignedOutputs = @(
            (Join-Path $env:GITHUB_WORKSPACE 'target\release\bundle'),
            (Join-Path $env:GITHUB_WORKSPACE 'target\release\qzip-desktop.exe')
          )
          foreach ($output in $staleSignedOutputs) {
            if (-not (Test-Path -LiteralPath $output)) { continue }
            $resolved = [IO.Path]::GetFullPath($output)
            $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
            if (-not $resolved.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw "Unsafe signed-output cleanup path: $resolved" }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-nsis.ps1 -UnsignedRelease
          "signing_mode=unsigned-degraded" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
      - name: Assemble and verify NSIS release assets
        shell: pwsh
        env:
          SIGNING_MODE: ${{ steps.build.outputs.signing_mode }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-rc-release.ps1 -Version $env:RELEASE_TAG -SkipBundle -SigningMode $env:SIGNING_MODE -Publisher $env:QZIP_WINDOWS_PUBLISHER
          if ($env:SIGNING_MODE -eq 'trusted') {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_TAG -ExpectedSigningMode trusted -RequireTrustedSignature -ExpectedPublisher $env:QZIP_WINDOWS_PUBLISHER
          } else {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_TAG -ExpectedSigningMode unsigned-degraded
          }
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: artifacts/release/${{ github.event.client_payload.tag }}/**
      - uses: actions/upload-artifact@v4
        with:
          name: qzip-windows-${{ github.event.client_payload.tag }}
          path: artifacts/release/${{ github.event.client_payload.tag }}/**
          if-no-files-found: error

  publish:
    name: publish-${{ github.event.client_payload.tag }}
    if: github.event_name == 'repository_dispatch' && github.event.action == 'qzip-release-build'
    needs: build-nsis
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
      RELEASE_SHA: ${{ github.event.client_payload.release_sha }}
      SIGNING_MODE: ${{ needs.build-nsis.outputs.signing_mode }}
      QZIP_WINDOWS_PUBLISHER: ${{ vars.QZIP_WINDOWS_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: qzip-windows-${{ github.event.client_payload.tag }}
          path: artifacts/release/${{ github.event.client_payload.tag }}
      - name: Fetch release payload verifier
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-sevenzip.ps1
      - name: Verify release assets
        shell: pwsh
        run: |
          if ($env:SIGNING_MODE -eq 'trusted') {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_TAG -ExpectedSigningMode trusted -RequireTrustedSignature -ExpectedPublisher $env:QZIP_WINDOWS_PUBLISHER
          } else {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_TAG -ExpectedSigningMode unsigned-degraded
          }
      - name: Create stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = "artifacts/release/$env:RELEASE_TAG/*"
          $arguments = @('release', 'create', $env:RELEASE_TAG, $assets, '--target', $env:RELEASE_SHA, '--generate-notes', '--latest', '--title', "QZip $env:RELEASE_TAG")
          if ($env:SIGNING_MODE -eq 'unsigned-degraded') {
            $warning = @'
          > [!WARNING]
          > 此版本未使用受信任的 Authenticode 证书签名，Windows 可能显示“未知发布者”或 SmartScreen 提示。
          > Windows 11 一级现代右键菜单已禁用；应用界面、“打开方式/QZip”和文件关联仍可正常使用。
          > 请使用随 Release 提供的 `checksums-sha256.txt` 验证安装包。

          This build is unsigned and feature-degraded. Windows may show an Unknown Publisher or SmartScreen warning. The Windows 11 modern context menu is unavailable; core archive features and file associations remain available.
          '@
            $arguments += @('--notes', $warning)
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Release published`n`n[$env:RELEASE_TAG](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG) was published from $env:RELEASE_SHA using signing mode ``$env:SIGNING_MODE``." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
