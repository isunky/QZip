name: Build and release NSIS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or build label, for example rc2, preview-20260731, or v1.0.0-rc.2
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease when mode is publish
        required: true
        default: true
        type: boolean
      mode:
        description: build-only uploads an internal artifact; publish creates a GitHub Release after trusted-signature verification
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - publish

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-nsis:
    name: build-nsis-${{ inputs.mode }}
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      release_label: ${{ steps.metadata.outputs.release_label }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      trusted_signing: ${{ steps.signing.outputs.enabled }}
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      QZIP_WINDOWS_PUBLISHER: ${{ vars.QZIP_WINDOWS_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: metadata
        name: Prepare release metadata
        shell: pwsh
        env:
          RELEASE_LABEL_INPUT: ${{ inputs.tag }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          $tag = $env:RELEASE_LABEL_INPUT.Trim()
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -match '[\r\n]' -or $tag.IndexOfAny([IO.Path]::GetInvalidFileNameChars()) -ge 0) {
            throw 'Release tag or build label must be non-empty and safe for a Windows filename.'
          }
          "release_label=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "tag=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "prerelease=$env:PRERELEASE_INPUT" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify official 7-Zip sidecar
        run: pnpm sidecar:fetch
      - name: Check workspace
        run: pnpm check
      - name: Run core compression regression
        run: pnpm test:core:windows
      - id: signing
        name: Prepare trusted signing credentials when available
        shell: pwsh
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if ($env:RELEASE_MODE -ne 'publish') {
            "enabled=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            exit 0
          }
          $required = @('WINDOWS_PFX_BASE64', 'WINDOWS_PFX_PASSWORD', 'QZIP_WINDOWS_PUBLISHER')
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            $message = "Trusted Windows signing is unavailable because these values are not configured: $($missing -join ', '). Building an internal development-signed artifact and skipping GitHub Release publishing."
            Write-Warning $message
            "### Trusted signing skipped`n`n$message" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            "enabled=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'qzip-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "QZIP_WINDOWS_PFX_PATH=$pfx" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "enabled=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Build NSIS installer
        shell: pwsh
        env:
          TRUSTED_SIGNING: ${{ steps.signing.outputs.enabled }}
        run: |
          if ($env:TRUSTED_SIGNING -eq 'true') {
            powershell -ExecutionPolicy Bypass -File scripts/build-nsis.ps1 -Release
          } else {
            powershell -ExecutionPolicy Bypass -File scripts/build-nsis.ps1 -CiDevelopmentSigning
          }
      - name: Assemble and verify NSIS release assets
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ steps.metadata.outputs.release_label }}
          TRUSTED_SIGNING: ${{ steps.signing.outputs.enabled }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/prepare-rc-release.ps1 -Version $env:RELEASE_LABEL -SkipBundle
          if ($env:TRUSTED_SIGNING -eq 'true') {
            powershell -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_LABEL -RequireTrustedSignature -ExpectedPublisher $env:QZIP_WINDOWS_PUBLISHER
          } else {
            powershell -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_LABEL
          }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/${{ steps.metadata.outputs.release_label }}/**
      - uses: actions/upload-artifact@v4
        with:
          name: qzip-nsis
          path: artifacts/release/${{ steps.metadata.outputs.release_label }}/**
          if-no-files-found: error

  publish:
    name: publish-github-release
    if: inputs.mode == 'publish' && needs.build-nsis.outputs.trusted_signing == 'true'
    needs: build-nsis
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qzip-nsis
          path: artifacts/release/${{ needs.build-nsis.outputs.release_label }}
      - name: Verify signed release assets
        shell: pwsh
        env:
          QZIP_WINDOWS_PUBLISHER: ${{ vars.QZIP_WINDOWS_PUBLISHER }}
          RELEASE_LABEL: ${{ needs.build-nsis.outputs.release_label }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify-release-assets.ps1 -Version $env:RELEASE_LABEL -RequireTrustedSignature -ExpectedPublisher $env:QZIP_WINDOWS_PUBLISHER
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-nsis.outputs.tag }}
          RELEASE_LABEL: ${{ needs.build-nsis.outputs.release_label }}
          PRERELEASE: ${{ needs.build-nsis.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $arguments = @('release', 'create', $env:TAG, "artifacts/release/$env:RELEASE_LABEL/*", '--target', $env:TARGET_SHA, '--generate-notes', '--title', "QZip $env:TAG")
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
